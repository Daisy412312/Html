<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniproject13-Js</title>
</head>
<body>
    <script>
        const quizScores = [88, 95, 76, 100, 92];
        let totalScore = 0;
        for (let i = 0; i < quizScores.length; i++) {
            totalScore += quizScores[i];
        }
        const averageScore = totalScore / quizScores.length;
        console.log(`Total Score: ${totalScore}`);
        console.log(`Average Score: ${averageScore}`);

        const CORRECT_PASSWORD = "secret";
        let attempts = 0;

        while (attempts < 3) {
            if (attempts === 2) {
                console.log("Account locked.");
                break;
            }else {
                attempts++;
                console.log("Attempt failed, trying again.");
            }
        }

        if (attempts === 2) {
            console.log("Success: Password correct.");
        }
    </script>
</body>
</html>
