<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniproject18-Js</title>
</head>
<body>
    <img id="toggle-image" src="/images/download (4).jpg" data-alt-src="https://images.google.com/">

    <input type="text" id="source-input">
    <p id="output-mirror"></p>
    <script>

        const img = document.getElementById("toggle-image");

        img.addEventListener("click", function() {
            const currentsrc = img.getAttribute("src");
            const altsrc = img.getAttribute("data-alt-src");

            img.setAttribute("src", altsrc);
            img.setAttribute("data-alt-src", currentsrc);
            
        });


        const input = document.getElementById("source-input");
        const output = document.getElementById("output-mirror");

        input.addEventListener("keydown", function (e) {
            if (e.key === "q") {
                e.preventDefault();
                console.log("Q is restricted");
            }
        });


        input.addEventListener("keyup", function (e) {
            output.textContent = e.target.value;
        });
        
    </script>

</body>
</html>
