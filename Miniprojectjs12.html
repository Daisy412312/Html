<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniproject12-Js</title>
</head>
<body>
    <script>
        const basePrice = 150;
        const memberLevel = "Gold";
        let finalPrice = basePrice;

        if (memberLevel === "Gold" && basePrice > 100) {
            finalPrice = finalPrice * 0.8;
        }else if (memberLevel === "Silver") {
            finalPrice = finalPrice * 0.9;
        }else {
            console.log(`No discount applied. Original price: ${basePrice}`);
        }

        console.log(`Final price: ${finalPrice}`);

        let currentState = "red";
        let nextState;
        switch (currentState) {
            case "red":
            nextState = "green";
            break;
            case "yellow":
            nextState = "red";
            break;
            case "green":
            nextState = "yellow";
            break;
            default:
            nextState = "invalid";
        }

        console.log(`The light changes from ${currentState} to $(nextState).`)
    </script>
</body>
</html>
