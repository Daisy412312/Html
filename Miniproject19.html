    <script>
        function ispasswordstrong(password) {
            return (
                password.length >= 8 &&
                /[A-Z]/.test(password) &&
                /\d/.test(password)
            );
        }

        console.log(ispasswordstrong("password1"));
        console.log(ispasswordstrong("pass"));

        const PHONE_REGEX = /\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/;

        function validatephone(numberString) {
            return PHONE_REGEX.test(numberString);
