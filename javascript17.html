<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day17-JS</title>
</head>
<body>
    <div id="container">
     <h2 class="title">Welcome</h2>
     <!-- <p data-status="created">This is new Paragraph</p> -->
     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nisi, architecto? Quide</p>
     <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
    <script>
        const containerDiv = document.getElementById("container");
        console.log(containerDiv); 

        const headerH2 = document.querySelector("h2");
        console.log(headerH2);
        headerH2.textContent = "DOM Practice Header";
        headerH2.style.color = "blue";
        const newP = document.createElement("P");
        console.log(newP);
        newP.textContent = "This is new Paragraph.";
        newP.setAttribute("data-status", "created");
        console.log(newP);
        containerDiv.appendChild(newP);

        // allparagraphs.forEach((p) => {
        //     p.style.backgroundColor = "lightgray";
        // });

        const allparagraphs = document.querySelectorAll("p");
        allparagraphs.forEach((p) => {
            p.style.backgroundColor = "lightgray";
        });
    </script>
</body>
</html>
