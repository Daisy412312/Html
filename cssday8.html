<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssday8</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    #flex-container{
        display: flex;
        height: 300px;
        border: 2px solid black;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .box{
        width: 80px;
        height: 80px;
        background-color: lightblue;
        margin: 5px;
        
    }
    #flex-container div:nth-child(2){
        order: -1;
    }
    .box{
        flex-grow: 1;
    }
    #flex-container div:nth-child(3){
        align-self: flex-start;
    }
</style>
<body>
    <div id="flex-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>
</body>
</html>
