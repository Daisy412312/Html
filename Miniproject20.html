<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniproject20-Js</title>
</head>
<body>
    <p id="quote-text">Click button to get a quote!</p>
    <button id="refresh-quote">Refresh Quote</button>


    <script>
        function loadQuote() {
            fetch("https://api.kanye.rest/")
            .then(response => response.json())
            .then(data => {
                document.getElementById("quote-text").textContent = data.quote;
            })

            .catch(error => {
                document.getElementById("quote-text").textContent = "Failed to load quote.";
            });
        }

        document.getElementById("refresh-quote").addEventListener("click", loadQuote);



        function processposts() {
            fetch("https://jsonplaceholder.typicode.com/posts")
            .then(response => response.json())
            .then(posts => {

                const userposts = posts.filter(post => post.userId === 1);

                const totalCount = userposts.reduce((count, post) => count + 1, 0);

                console.log("Total posts for userId 1:", totalCount);
            })

            .catch(error => {
                console.error("Error fetching posts:", error);
            });
        }

        processposts();


    </script>
</body>
</html>
